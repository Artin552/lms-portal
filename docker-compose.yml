# Запуск всего проекта: docker compose up --build
# Портал: http://localhost:8080
#
# Секреты ниже – значения для локального запуска. В продакшене задайте свои
# в файле .env рядом с этим файлом (см. .env.example).

services:
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${BACKEND_PORT:-4000}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms}@postgres:5432/${POSTGRES_DB:-lms}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-docker-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-docker-refresh-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      REFRESH_REUSE_GRACE_MS: ${REFRESH_REUSE_GRACE_MS:-10000}
      FILE_URL_SECRET: ${FILE_URL_SECRET:-local-docker-file-secret-change-me}
      FILE_URL_TTL_SEC: ${FILE_URL_TTL_SEC:-3600}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      SEMESTER_START: ${SEMESTER_START:-2026-09-01}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - uploads:${UPLOAD_DIR:-/app/uploads}
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:${BACKEND_PORT:-4000}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${APP_NAME:-ННГАСУ}
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      NGINX_CLIENT_MAX_BODY_MB: ${NGINX_CLIENT_MAX_BODY_MB:-100}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}" ]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
  uploads:
